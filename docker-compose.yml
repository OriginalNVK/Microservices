version: '3.8'

services:
  # ==============================
  # Infrastructure
  # ==============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - hkshop-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - hkshop-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - hkshop-network

  # ==============================
  # Databases
  # ==============================
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: UserServiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - hkshop-network

  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ProductServiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - hkshop-network

  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: CartServiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    networks:
      - hkshop-network

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: OrderServiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - hkshop-network

  invoice-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: InvoiceServiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - invoice-db-data:/var/lib/postgresql/data
    networks:
      - hkshop-network

  # ==============================
  # Microservices
  # ==============================
  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=user-db;Port=5432;Database=UserServiceDb;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__Secret=HKShopSuperSecretKeyForJWT2024!
      - Jwt__Issuer=UserService
      - Jwt__Audience=HKShopClients
    depends_on:
      - user-db
      - kafka
    networks:
      - hkshop-network

  product-service:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=product-db;Port=5432;Database=ProductServiceDb;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__Secret=HKShopSuperSecretKeyForJWT2024!
      - Jwt__Issuer=UserService
      - Jwt__Audience=HKShopClients
    depends_on:
      - product-db
      - kafka
    networks:
      - hkshop-network

  cart-service:
    build:
      context: ./CartService
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=cart-db;Port=5432;Database=CartServiceDb;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__Secret=HKShopSuperSecretKeyForJWT2024!
      - Jwt__Issuer=UserService
      - Jwt__Audience=HKShopClients
    depends_on:
      - cart-db
      - kafka
    networks:
      - hkshop-network

  order-service:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=order-db;Port=5432;Database=OrderServiceDb;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__Secret=HKShopSuperSecretKeyForJWT2024!
      - Jwt__Issuer=UserService
      - Jwt__Audience=HKShopClients
    depends_on:
      - order-db
      - kafka
    networks:
      - hkshop-network

  invoice-service:
    build:
      context: ./InvoiceService
      dockerfile: Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=invoice-db;Port=5432;Database=InvoiceServiceDb;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__Secret=HKShopSuperSecretKeyForJWT2024!
      - Jwt__Issuer=UserService
      - Jwt__Audience=HKShopClients
    depends_on:
      - invoice-db
      - kafka
    networks:
      - hkshop-network

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Secret=HKShopSuperSecretKeyForJWT2024!
      - Jwt__Issuer=UserService
      - Jwt__Audience=HKShopClients
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - invoice-service
    networks:
      - hkshop-network

networks:
  hkshop-network:
    driver: bridge

volumes:
  user-db-data:
  product-db-data:
  cart-db-data:
  order-db-data:
  invoice-db-data:
